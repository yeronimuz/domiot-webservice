plugins {
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

ext {
    baseName = 'lnb-iot-webservice'
    classifier = 'SNAPSHOT'
    mainClassName = 'org.domiot.webservice.WebService'
}

repositories {
    mavenLocal()
    mavenCentral()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId 'org.lankheet.domiot'
            artifactId 'domiot-webservice'
            version version

            from components.java
        }
    }
}

jacoco {
    toolVersion = "0.8.7"
    reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
}

configurations {
    compile.exclude module: 'spring-boot-starter-logging'
    all*.exclude group: 'commons-logging', module: 'commons-logging'
    apiContractSources
//    compile.exclude group: 'org.springframework.boot', name: 'spring-boot-starter-tomcat'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // report is always generated after tests run
}

dependencies {
    implementation 'org.lankheet.domiot:domiot-datatypes:0.9.0-SNAPSHOT'
    implementation 'org.lankheet.domiot:domiot-rest-api:1.3.0-SNAPSHOT'
    apiContractSources 'org.lankheet.domiot:domiot-rest-api:1.3.0-SNAPSHOT:sources'

    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.5.13'
    implementation 'org.springframework.boot:spring-boot-starter-parent:3.5.13'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.13'
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:3.5.0")
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.13'
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.5.13'
    implementation 'org.springframework.boot:spring-boot-starter-cache:3.5.13'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5:2.17.0'
    implementation 'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.mapstruct:mapstruct-processor:1.6.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    implementation("javax.xml.bind:jaxb-api:2.4.0-b180830.0359")

    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    compileOnly 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.slf4j:slf4j-api:2.0.12'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0-M1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.junit.platform:junit-platform-runner:1.11.0-M1'
    testImplementation 'org.hamcrest:hamcrest-junit:2.0.0.0'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
}

tasks.register('openApiCoverageReport', Exec) {
    group = 'verification'
    description = 'Compares domiot-rest-api contract mappings with live OpenAPI docs and writes a coverage report.'

    def openApiUrl = project.findProperty('openApiUrl') ?: 'http://localhost:7010/api/v3/api-docs'

    doFirst {
        def sourceJar = configurations.apiContractSources.files.find { file ->
            file.name.contains('domiot-rest-api') && file.name.endsWith('-sources.jar')
        }
        if (sourceJar == null) {
            throw new GradleException('Could not resolve domiot-rest-api sources jar for OpenAPI coverage check.')
        }

        commandLine 'python3',
                "$projectDir/scripts/openapi_coverage_report.py",
                '--api-sources', sourceJar,
                '--openapi-url', openApiUrl,
                '--out-dir', "$buildDir/reports/api-coverage"
    }
}

